<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>钻石回收业务受理</title>
    <style>
        /* 保持与主页高度一致的 AA POKER 极深墨绿底色，避免白屏闪烁 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020907;
            overflow: hidden;
        }
        /* 顶部提供一个返回按钮，方便用户随时点错返回主商城 */
        .back-bar {
            width: 100%;
            background-color: #04120e;
            border-bottom: 1px solid #064e3b;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }
        .back-btn {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .form-wrapper {
            width: 100%;
            height: calc(100% - 45px); /* 减去顶部返回栏的高度 */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        /* 你的 Tally 专属全屏无缝适配样式 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 顶部导航，方便客户返回主商城 -->
    <div class="back-bar">
        <a href="index.html" class="back-btn">⬅ 返回钻石商城</a>
    </div>

    <!-- 专属表单无缝撑满全屏区域 -->
    <div class="form-wrapper">
        <!-- 成功嵌套你的专属 Tally 代码组件 -->
        <iframe data-tally-src="https://tally.so/embed/GxkGbO?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="894" frameborder="0" marginheight="0" marginwidth="0" title="/"></iframe>
    </div>

    <!-- 载入你的 Tally 专属控制脚本 -->
    <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>

</body>
</html>
