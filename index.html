<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钻石官方商城</title>
    <style>
        /* 全局AA POKER科技感极深墨绿背景 */
        body { 
            background-color: #020907; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: #e2e8f0; 
            margin: 0; 
            padding: 20px 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
        }

        .main-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        
        .box-card { 
            background: rgba(4, 18, 14, 0.75); 
            border: 1px solid #064e3b; 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(16, 185, 129, 0.05); 
            padding: 20px 16px; 
            box-sizing: border-box; 
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: #10b981; 
            margin: 0 0 12px 0;
            font-weight: bold;
        }
        
        .notice-text {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 16px;
        }

        .img-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-size: 0;
        }
        .img-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 三大分类网格布局 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-link {
            text-decoration: none;
            color: inherit;
        }

        /* 分类子卡片优化 */
        .grid-item {
            background: #03120e;
            border: 1px solid #064e3b;
            border-radius: 10px;
            padding: 16px 4px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .grid-item:hover, .grid-item:active {
            border-color: #10b981; 
            color: #ffffff;
            background: #05241c;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
        }

        /* 纯粹的独立图片发光容器：完全没有误差 */
        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            margin-bottom: 8px;
            overflow: hidden;
            background-color: #041410;
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 让单张图片完美撑满圆形剪裁圈 */
        }

        .footer-notice {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            line-height: 1.6;
            margin-top: auto; 
            padding-top: 14px;
            width: 100%;
            border-top: 1px dashed rgba(6, 78, 59, 0.4);
        }
        .alert-highlight {
            color: #ef4444; 
            font-weight: bold;
        }

        @media (max-width: 380px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container" style="display: flex; flex-direction: column; min-height: 92vh;">
        <!-- 主标题 -->
        <div class="main-title">钻石官方商城</div>

        <!-- 1. 公告栏目卡片 -->
        <div class="box-card">
            <div class="section-title">📢 温馨提醒</div>
            <div class="notice-text">
                所有操作均可在网站内实现，请认真填写正确你的游戏账户和游戏ID，以免出现充值或提现不到账的情况
            </div>
           <div class="notice-text">
                使用苹果大陆ID用户，可以直接在苹果商店搜索“Dicemotionarena”下载AA poker正版大陆商店包，账号系统通用，请放心使用
            </div>
           <div class="notice-text">
                优惠活动添加客服XV：datangbeifeng
            </div>
            <div class="img-container">
                <img src="logo.jpg" alt="AA POKER">
            </div>
        </div>

        <!-- 2. 三大分类导航区（已全面对接独立高清定制图标文件） -->
        <div class="grid-container">
            <!-- 2.1 充值钻石 -->
            <a href="pay.html" target="_blank" class="grid-link">
                <div class="grid-item">
                    <div class="icon-box"><img src="icon1.jpg" alt="充值"></div>
                    <div>充值钻石</div>
                </div>
            </a>

            <!-- 2.2 回收钻石 -->
            <a href="process.html" class="grid-link">
                <div class="grid-item">
                    <div class="icon-box"><img src="icon2.jpg" alt="回收"></div>
                    <div>回收钻石</div>
                </div>
            </a>

            <!-- 2.3 下载中心 -->
            <a href="https://aapoker.app" target="_blank" class="grid-link">
                <div class="grid-item">
                    <div class="icon-box"><img src="icon3.jpg" alt="下载"></div>
                    <div>下载中心</div>
                </div>
            </a>
        </div>

        <!-- 3. 底部公告栏 -->
        <div class="footer-notice">
            <span class="alert-highlight">⚠️ 提示：请认真填写谨防不到账的情况</span><br>
            由于填写错误导致的不到账行为，平台概不负责
        </div>
    </div>

</body>
</html>
