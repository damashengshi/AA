<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钻石官方商城 - AA POKER</title>
    <style>
        /* 全局高科技墨绿放射渐变背景 */
        body { 
            background: radial-gradient(circle at top, #05231a 0%, #010806 65%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
            color: #e2e8f0; 
            margin: 0; 
            padding: 24px 14px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 自适应弹性列排版核心容器 */
        .container {
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 主标题：立体双色渐变字 */
        .main-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff 40%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        /* =================================================== */
        /* 【核心重塑】双图滚动轮播区域样式 */
        /* =================================================== */
        .slider-wrapper {
            width: 100%;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            margin-bottom: 20px;
            aspect-ratio: 2 / 1; /* 严丝合缝锁定 2:1 宽高比，防止页面抖动 */
        }
        
        .slider-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 采用高级透明度淡入淡出，比生硬的左右位移更具质感 */
        .slider-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 1;
        }
        
        .slider-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .slider-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 轮播指示小圆点 */
        .slider-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .slider-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slider-dot.active {
            background: #10b981;
            width: 16px; /* 激活时展开拉长 */
            border-radius: 4px;
            box-shadow: 0 0 8px #10b981;
        }
        /* =================================================== */

        /* 公告面板：半透明高级玻璃拟态 (Glassmorphism) */
        .box-card { 
            background: linear-gradient(135deg, rgba(5, 25, 19, 0.75) 0%, rgba(2, 13, 10, 0.85) 100%); 
            border: 1px solid rgba(16, 185, 129, 0.2); 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
            padding: 20px; 
            box-sizing: border-box; 
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
        }

        .section-title {
            font-size: 15px;
            color: #10b981; 
            margin: 0 0 12px 0;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }
        
        .notice-text {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 10px;
        }
        .notice-text:last-of-type {
            margin-bottom: 0;
        }

        /* 客服高亮框 */
        .kefu-highlight {
            background: rgba(245, 158, 11, 0.08);
            border: 1px dashed rgba(245, 158, 11, 0.25);
            padding: 10px 12px;
            border-radius: 8px;
            color: #f59e0b;
            font-weight: bold;
        }

        /* 导航网格：优化间距 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px;
            margin-bottom: 24px;
        }

        .grid-link {
            text-decoration: none;
            color: inherit;
        }

        /* 升级子卡片：高亮微光霓虹边框 */
        .grid-item {
            background: linear-gradient(to bottom, #031511 0%, #010a08 100%);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 14px;
            padding: 18px 4px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        
        /* 鼠标移入/手机点击时的悬浮霓虹特效 */
        .grid-item:hover, .grid-item:active {
            border-color: #10b981; 
            color: #ffffff;
            background: linear-gradient(to bottom, #063126 0%, #021a14 100%);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);
            transform: translateY(-2px);
        }

        /* 精细发光圆环图标框 */
        .icon-box {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            margin-bottom: 10px;
            overflow: hidden;
            background-color: #020e0b;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }
        .grid-item:hover .icon-box {
            transform: scale(1.05);
            border-color: #34d399;
        }
        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* 优雅的虚线页脚 */
        .footer-notice {
            font-size: 11px;
            color: #475569;
            text-align: center;
            line-height: 1.6;
            padding-top: 18px;
            padding-bottom: 20px;
            width: 100%;
            border-top: 1px dashed rgba(6, 78, 59, 0.3);
            box-sizing: border-box;
        }
        .alert-highlight {
            color: #ef4444; 
            font-weight: bold;
        }

        /* 移动端特殊窄屏优化 */
        @media (max-width: 380px) {
            .grid-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .grid-item {
                flex-direction: row;
                padding: 12px 20px;
                justify-content: flex-start;
                gap: 16px;
            }
            .icon-box {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

 <!-- 💡 在这里插入您的 JavaScript 控制代码 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const slides = document.querySelectorAll('.slider-slide');
            const dots = document.querySelectorAll('.slider-dot');
            let currentIndex = 0;
            const intervalTime = 3000; // 设置交替间隔为 3.0 秒

            function changeSlide(nextIndex) {
                // 清理旧状态
                slides[currentIndex].classList.remove('active');
                dots[currentIndex].classList.remove('active');
                
                // 推进坐标值
                currentIndex = nextIndex;
                
                // 挂载新状态
                slides[currentIndex].classList.add('active');
                dots[currentIndex].classList.add('active');
            }

            function autoPlay() {
                let nextIndex = (currentIndex + 1) % slides.length;
                changeSlide(nextIndex);
            }

            // 挂载定时轮询机制
            let timer = setInterval(autoPlay, intervalTime);

            // 指示圆点的手动劫持控制
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    clearInterval(timer);
                    changeSlide(index);
                    timer = setInterval(autoPlay, intervalTime);
                });
            });
        });
    </script>
