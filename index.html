<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人专属展示空间</title>
    <style>
        /* 高级流体渐变背景与基础重置 */
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 24px 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* 苹果风格的毛玻璃微光卡片 */
        .card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%; 
            max-width: 440px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            padding: 32px 24px; 
            box-sizing: border-box; 
            text-align: center; 
        }
        
        /* 头像动效优化 */
        .avatar { 
            width: 96px; 
            height: 96px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
            margin: 0 auto 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 38px; 
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            transition: transform 0.3s ease;
        }
        .avatar:hover {
            transform: scale(1.05) rotate(5deg);
        }
        
        h1 { font-size: 24px; font-weight: 700; margin: 0 0 10px 0; letter-spacing: -0.5px; background: linear-gradient(to right, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 14px; color: #94a3b8; margin: 0 0 28px 0; line-height: 1.6; }
        
        /* 嵌入表单容器美化 */
        .form-container { 
            width: 100%; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            padding-top: 24px; 
            border-radius: 12px;
            overflow: hidden;
        }
        iframe { width: 100%; min-height: 520px; border: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- 个人信息区域：你可以把 👋 换成你自己的网络头像图片链接 -->
        <div class="avatar">💎</div>
        <h1>AA钻石回收平台</h1>
        <p>请认真填写数据，以免转错，提交后静待30分钟到账</p>

        <!-- 表单嵌入区域 -->
        <div class="form-container">
            <!-- ！！！重要：请把下面这段 iframe 换成你从 Tally 复制出来的专属代码 ！！！ -->
            <iframe data-tally-src="https://tally.so/embed/GxkGbO?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="894" frameborder="0" marginheight="0" marginwidth="0" title="/"></iframe>
<script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>
        </div>
    </div>

</body>
</html>
