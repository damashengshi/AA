<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>回收钻石流程</title>
    <style>
        /* 全局AA POKER科技感极深墨绿背景 */
        body { 
            background-color: #020907; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: #e2e8f0; 
            margin: 0; 
            padding: 0 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            /* 【核心优化：动态安全边距】 */
            padding-top: 110px;  /* 预留出顶部固定吸顶区域的高度，防止内容被盖住 */
            padding-bottom: 80px; /* 预留出底部固定吸底按钮的高度，防止内容被盖住 */
        }

        /* 【核心重构：永久固定悬浮顶部的吸顶包裹层】 */
        .top-fixed-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            /* 采用带有透明度的极深墨绿，让上滑的内容能隐约透出，极具高级游戏沉浸感 */
            background: linear-gradient(to bottom, #020907 85%, rgba(2, 9, 7, 0) 100%);
            padding: 16px 12px 20px 12px;
            box-sizing: border-box;
            z-index: 1000; /* 确保层级高于内容卡片 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-inner-container {
            width: 100%;
            max-width: 436px; /* 与下方卡片宽度完美对齐 */
            display: flex;
            flex-direction: column;
        }

        /* 顶部返回导航栏 */
        .back-bar {
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 标题样式 */
        .main-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        
        /* 核心卡片容器 */
        .box-card { 
            background: rgba(4, 18, 14, 0.75); 
            border: 1px solid #064e3b; 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(16, 185, 129, 0.05); 
            padding: 22px 16px; 
            box-sizing: border-box; 
            margin-bottom: 20px;
        }

        /* 荧光绿小标题 */
        .section-title {
            font-size: 14px;
            color: #10b981; 
            margin: 0 0 14px 0;
            font-weight: bold;
        }
        
        /* 公告与提示文字排版 */
        .notice-text {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 16px;
        }

        /* 修改为纵向垂直队列排列 */
        .img-vertical-list {
            display: flex;
            flex-direction: column;
            gap: 16px; 
            width: 100%;
            margin: 12px 0;
        }

        /* 优化后的独立图片容器 */
        .img-item {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            background: rgba(2, 9, 7, 0.6);
            box-sizing: border-box;
            overflow: hidden;
            font-size: 0; 
        }
        .img-item img {
            width: 100%;
            height: auto; 
            display: block;
        }
        
        /* 暂无图片时的科技感虚线占位框样式 */
        .img-placeholder {
            width: 100%;
            padding: 30px 10px;
            border: 1px dashed #064e3b;
            border-radius: 10px;
            font-size: 13px;
            color: #475569;
            text-align: center;
            box-sizing: border-box;
        }

        /* 温馨提示模块样式 */
        .tip-box {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 24px;
            box-sizing: border-box;
        }
        .tip-title {
            font-size: 13px;
            color: #ef4444; 
            font-weight: bold;
            margin-bottom: 6px;
        }
        .tip-content {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* 永久固定悬浮底部的下一步发光长条按钮 */
        .next-btn-fixed-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #020907 80%, rgba(2, 9, 7, 0) 100%);
            padding: 12px 16px 20px 16px; 
            box-sizing: border-box;
            z-index: 999;
            display: flex;
            justify-content: center;
        }

        .next-btn {
            display: block;
            width: 100%;
            max-width: 436px; /* 与上层卡片最大宽度完美对齐线 */
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .next-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }
    </style>
</head>
<body>

    <!-- 【核心新增：顶部固定吸顶包裹层】 -->
    <div class="top-fixed-wrapper">
        <div class="top-inner-container">
            <!-- 顶部返回栏 -->
            <div class="back-bar">
                <a href="index.html" class="back-btn">⬅ 返回商城首页</a>
            </div>
            <!-- 主标题 -->
            <div class="main-title">回收钻石流程</div>
           <div class="notice-text" style="color: #f59e0b; font-weight: bold; text-align: center;">
             钻石发送到ID<span style="color: #ef4444;">86119100</span>后点击下一步</div>
        </div>
        </div>
    </div>

    <!-- 中部滚动内容区 -->
    <div class="container">
        <!-- 1. 公告栏卡片 -->
        <div class="box-card">
            <div class="section-title">📢 操作须知</div>
            <div class="notice-text">
                严格按照以下提示操作，点击下一步上传操作凭证后提交
            </div>

            <!-- 2. 三张指示图片竖着向下完整排列区 -->
            <div class="img-vertical-list">
                <!-- 第一步图片 -->
                <div class="img-item">
                    <img src="step1.jpg" alt="步骤一截图" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder" style="display:none;">⚏ 步骤一 截图流程说明 ⚏</div>
                </div>
                
                <!-- 第二步图片 -->
                <div class="img-item">
                    <img src="step2.jpg" alt="步骤二截图" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder" style="display:none;">⚏ 步骤二 截图流程说明 ⚏</div>
                </div>
                
                <!-- 第三步图片 -->
                <div class="img-item">
                    <img src="step3.jpg" alt="步骤三截图" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder" style="display:none;">⚏ 步骤三 截图流程说明 ⚏</div>
                </div>
            </div>
        </div>

        <!-- 3. 温馨提示卡片 -->
        <div class="tip-box">
            <div class="tip-title">⚠️ 温馨提示</div>
            <div class="tip-content">
                操作完以上流程后，点击赠送记录，截图保存，方便下一步上传
            </div>
        </div>
    </div>

    <!-- 底部固定吸底包裹层 -->
    <div class="next-btn-fixed-wrapper">
        <!-- 跳转下一步按钮 -->
        <a href="form.html" class="next-btn">已经操作无误后下一步</a>
    </div>

</body>
</html>
