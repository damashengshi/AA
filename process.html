<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>回收钻石流程</title>
    <style>
        /* 全局AA POKER科技感极深墨绿背景 */
        body { 
            background-color: #020907; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: #e2e8f0; 
            margin: 0; 
            padding: 20px 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 94vh;
        }

        /* 顶部返回导航栏 */
        .back-bar {
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 标题样式 */
        .main-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        
        /* 核心卡片容器 */
        .box-card { 
            background: rgba(4, 18, 14, 0.75); 
            border: 1px solid #064e3b; 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(16, 185, 129, 0.05); 
            padding: 22px 16px; 
            box-sizing: border-box; 
            margin-bottom: 20px;
        }

        /* 荧光绿小标题 */
        .section-title {
            font-size: 14px;
            color: #10b981; 
            margin: 0 0 14px 0;
            font-weight: bold;
        }
        
        /* 公告与提示文字排版 */
        .notice-text {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 16px;
        }

        /* 【核心改动】修改为纵向垂直队列排列 */
        .img-vertical-list {
            display: flex;
            flex-direction: column;
            gap: 16px; /* 图片与图片之间的纵向间距 */
            width: 100%;
            margin: 12px 0;
        }

        /* 优化后的独立图片容器：保证完整展示不裁剪 */
        .img-item {
            width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            background: rgba(2, 9, 7, 0.6);
            box-sizing: border-box;
            overflow: hidden;
            font-size: 0; /* 彻底消除图片底部间隙 */
        }
        .img-item img {
            width: 100%;
            height: auto; /* 核心：高度自动弹性扩展，完美展现整张大图 */
            display: block;
        }
        
        /* 暂无图片时的科技感虚线占位框样式 */
        .img-placeholder {
            width: 100%;
            padding: 30px 10px;
            border: 1px dashed #064e3b;
            border-radius: 10px;
            font-size: 13px;
            color: #475569;
            text-align: center;
            box-sizing: border-box;
        }

        /* 温馨提示模块样式 */
        .tip-box {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 24px;
            box-sizing: border-box;
        }
        .tip-title {
            font-size: 13px;
            color: #ef4444; 
            font-weight: bold;
            margin-bottom: 6px;
        }
        .tip-content {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        /* 下一步高级发光长条按钮 */
        .next-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: auto; 
        }
        .next-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部返回栏 -->
        <div class="back-bar">
            <a href="index.html" class="back-btn">⬅ 返回商城首页</a>
        </div>

        <!-- 主标题 -->
        <div class="main-title">回收钻石流程</div>

        <!-- 1. 公告栏卡片 -->
        <div class="box-card">
            <div class="section-title">📢 操作须知</div>
            <div class="notice-text">
                严格按照以下提示操作，点击下一步上传操作凭证后提交
            </div>

            <!-- 2. 【已重构】三张指示图片竖着向下完整排列区 -->
            <div class="img-vertical-list">
                <!-- 第一步图片 -->
                <div class="img-item">
                    <!-- 如果检测到本地没有图片，会自动无缝无错切换成下方的虚线框提示 -->
                    <img src="step1.jpg" alt="步骤一截图" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder" style="display:none;">⚏ 步骤一 截图流程说明 ⚏</div>
                </div>
                
                <!-- 第二步图片 -->
                <div class="img-item">
                    <img src="step2.jpg" alt="步骤二截图" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder" style="display:none;">⚏ 步骤二 截图流程说明 ⚏</div>
                </div>
                
                <!-- 第三步图片 -->
                <div class="img-item">
                    <img src="step3.jpg" alt="步骤三截图" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="img-placeholder" style="display:none;">⚏ 步骤三 截图流程说明 ⚏</div>
                </div>
            </div>
        </div>

        <!-- 3. 温馨提示卡片 -->
        <div class="tip-box">
            <div class="tip-title">⚠️ 温馨提示</div>
            <div class="tip-content">
                操作完以上流程后，点击赠送记录，截图保存，方便下一步上传
            </div>
        </div>

        <!-- 4. 跳转下一步按钮 -->
        <a href="form.html" class="next-btn">已经操作无误后下一步</a>
    </div>

</body>
</html>
