<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>回收钻石新手引导</title>
    <style>
        /* 全屏重置，严格禁止 H5 页面滚动，保持独立原生感 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020907; /* 极致暗黑底色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 引导页核心全屏容器 */
        .guide-page {
            width: 100%;
            height: 100%;
            display: none; /* 默认隐藏 */
            flex-direction: column;
            justify-content: space-between; /* 顶部导航、中部核心框、底部按钮三项垂直等分 */
            box-sizing: border-box;
            padding: calc(10px + env(safe-area-inset-top)) 16px calc(15px + env(safe-area-inset-bottom)) 16px;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 当前激活显示的页面 */
        .guide-page.active {
            display: flex;
            animation: fadeIn 0.25s ease-in-out;
        }

        /* ---------------- 1. 顶部导航与页码 ---------------- */
        .guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 44px;
        }
        .back-btn {
            color: #10b981; /* 荧光绿 */
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .page-indicator {
            color: #475569;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .page-indicator span {
            color: #34d399;
        }

        /* ---------------- 2. 中部核心引导框（核心修改区） ---------------- */
        .guide-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 0;
            box-sizing: border-box;
        }

        /* 独立固定的核心引导卡片框 */
        .guide-card {
            width: 100%;
            max-width: 360px; /* 限制大屏手机或小平板下的最大宽度 */
            max-height: 72vh; /* 严格限制在屏幕垂直方向的 72% 以内，防止长图把底部按钮挤出屏幕 */
            background-color: rgba(4, 18, 14, 0.8);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* 文本标题区 */
        .guide-title {
            font-size: 22px;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 4px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .guide-subtitle {
            font-size: 13.5px;
            color: #fbbf24; /* 金黄强调 */
            margin-bottom: 14px;
            font-weight: 600;
            text-align: center;
        }

   /* 图片固定框：专为竖屏游戏截图优化的长方形比例 */
.guide-image-box {
    width: 100%;
    height: 360px; /* 显著调高高度，给竖屏截图留足空间 */
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    overflow: hidden;
    background-color: transparent; /* 移除原本的黑色背景，让边缘不突兀 */
    flex-shrink: 0;
}

/* 核心：让高图在纵向上 100% 填满框，左右不再有大面积死黑 */
.guide-image-box img {
    width: auto; /* 宽度根据高度自动按比例缩放 */
    height: 100%; /* 高度完全填满整个框 */
    max-width: 100%;
    object-fit: contain; 
}

/* 核心：约束图片最大只能等于容器，自动等比缩放 */
.guide-image-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

        
        /* 核心：确保 step 图片在框内完全完整显示，绝不被裁切、不拉伸 */
        .guide-image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* 底部说明文案区 */
        .notice-container {
            width: 100%;
            background-color: rgba(2, 9, 7, 0.6);
            border-top: 1px solid rgba(16, 185, 129, 0.1);
            padding-top: 12px;
            box-sizing: border-box;
        }
        .notice-row {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* ---------------- 3. 底部固定的操作按钮 ---------------- */
        .guide-footer {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 4px;
        }
        .next-btn {
            width: 100%;
            max-width: 360px;
            height: 48px;
            background-color: #10b981; /* 荧光绿 */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: background 0.15s;
        }
        .next-btn:active {
            background-color: #059669;
        }

        /* 关键颜色高亮处理 */
        .highlight-green { color: #34d399; font-weight: bold; }
        .highlight-gold { color: #fbbf24; font-weight: bold; }

        /* 界面淡入 */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ================= 页面 1 ================= -->
    <div id="page1" class="guide-page active">
        <div class="guide-header">
            <div class="back-btn" onclick="location.href='index.html'">✕ 退出引导</div>
            <div class="page-indicator"><span>1</span> / 3</div>
        </div>
        
        <div class="guide-body">
            <!-- 独立的引导框 -->
            <div class="guide-card">
                <div class="guide-title">进入游戏背包</div>
                <div class="guide-subtitle">操作须知：2000 💎 起回收</div>
                
                <!-- 固定在框内的图片容器 -->
                <div class="guide-image-box">
                    <img src="step1.png" alt="进入游戏背包并点击赠送">
                </div>
                
                <div class="notice-container">
                    <div class="notice-row">严格按照提示操作。登录后点击右下角进入<span class="highlight-green">【我的】</span>，随后点击进入<span class="highlight-green">【背包】</span>并切换至顶部<span class="highlight-green">【赠送】</span>标签。</div>
                </div>
            </div>
        </div>
        
        <div class="guide-footer">
            <button class="next-btn" onclick="nextPage(2)">确认无误，下一步</button>
        </div>
    </div>


    <!-- ================= 页面 2 ================= -->
    <div id="page2" class="guide-page">
        <div class="guide-header">
            <div class="back-btn" onclick="prevPage(1)">←上一步</div>
            <div class="page-indicator"><span>2</span> / 3</div>
        </div>
        
        <div class="guide-body">
            <!-- 独立的引导框 -->
            <div class="guide-card">
                <div class="guide-title">精准赠送代理</div>
                <div class="guide-subtitle">核对目标 ID <span class="highlight-red" style="font-size:16px; color:#ef4444;">861119100</span> 防止转错</div>
                
                <!-- 固定在框内的图片容器 -->
                <div class="guide-image-box">
                    <img src="step2.png" alt="精确输入代理ID并点击赠送">
                </div>
                
                <div class="notice-container">
                    <div class="notice-row">输入框精准输入官方回收代理ID<span class="highlight-gold" style="font-size:16px;">861119100</span>，核对名称是<span class="highlight-gold" style="font-size:16px;">萌主号</span>无误，点击<span class="highlight-green">【赠送平台钻石】</span></div>
                </div>
            </div>
        </div>
        
        <div class="guide-footer">
            <button class="next-btn" onclick="nextPage(3)">已完成赠送，下一步</button>
        </div>
    </div>


    <!-- ================= 页面 3 ================= -->
    <div id="page3" class="guide-page">
        <div class="guide-header">
            <div class="back-btn" onclick="prevPage(2)">⬅ 上一步</div>
            <div class="page-indicator"><span>3</span> / 3</div>
        </div>
        
        <div class="guide-body">
            <!-- 独立的引导框 -->
            <div class="guide-card">
                <div class="guide-title">截取凭证并提交</div>
                <div class="guide-subtitle">预计 60 分钟内快速到账</div>
                
                <!-- 固定在框内的图片容器 -->
                <div class="guide-image-box">
                    <img src="step3.png" alt="查看并截取历史记录凭证">
                </div>
                
                <div class="notice-container">
                    <div class="notice-row">请务必前往<span class="highlight-green">【赠送记录】</span>中截取包含数量和时间的完整<span class="highlight-red" style="font-size:16px; color:#ef4444; font-weight: bold;">【截图】</span>以备下一步上传截图至系统申请<span class="highlight-red" style="font-size:16px; color:#ef4444; font-weight: bold;">【下款】</span></div>
                </div>
            </div>
        </div>
        
        <div class="guide-footer">
            <button class="next-btn" onclick="location.href='form.html'">上传截图提交</button>
        </div>
    </div>

    <!-- H5 页面切换逻辑 -->
    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.guide-page').forEach(page => page.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
        }
        function prevPage(pageNumber) {
            document.querySelectorAll('.guide-page').forEach(page => page.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
        }
    </script>
</body>
</html>
