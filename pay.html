<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>充值钻石 - 官方商城</title>
    <style>
        /* 全局AA POKER极深墨绿背景 */
        body { 
            background-color: #020907; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
            /* 【核心优化：动态安全边距】 */
            padding-top: 185px; /* 预留出顶部所有吸顶公告区域的高度，防止商品被盖住 */
            padding-bottom: 20px;
        }

        /* 【核心重构：永久固定悬浮顶部的全能吸顶包裹层】 */
        .top-fixed-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            /* 采用带有透明度的极深墨绿，让商品内容上滑时能隐约透出，极具高级感 */
            background: linear-gradient(to bottom, #020907 90%, rgba(2, 9, 7, 0) 100%);
            padding: 16px 12px 24px 12px;
            box-sizing: border-box;
            z-index: 1000; /* 确保层级永远高于下方的商品卡片 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-inner-container {
            width: 100%;
            max-width: 436px; /* 与下方商品卡片宽度完美对齐线 */
            display: flex;
            flex-direction: column;
        }

        /* 顶部返回导航栏 */
        .back-bar {
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 主标题样式 */
        .main-title {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin: 0 0 14px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        /* 吸顶容器内的两段公告文字卡片 */
        .sub-notice-box {
            background: rgba(4, 18, 14, 0.9); /* 加深背景，确保滚动时底层商品文字不干扰阅读 */
            border: 1px solid #064e3b;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .sub-text-orange {
            font-size: 13px;
            color: #f97316; /* 警示橙色提示游戏ID */
            font-weight: bold;
            margin-bottom: 6px; 
        }
        .sub-text-yellow {
            font-size: 13px;
            color: #f59e0b; /* 亮眼黄色提示客服 */
            font-weight: bold;
        }

        /* 全局去下划线链接包装 */
        .item-link {
            text-decoration: none;
            display: block;
            margin-bottom: 14px; 
        }
        
        /* 商品条目卡片框 */
        .product-card { 
            background: #04120e; 
            border: 1px solid #064e3b; 
            border-radius: 12px; 
            padding: 16px; 
            box-sizing: border-box; 
            display: flex;
            align-items: center;
            gap: 16px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        .product-card:hover, .product-card:active {
            border-color: #10b981;
            background: #061c16;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.1);
        }

        /* 左侧统一上传的图片标志容器 */
        .img-logo-box {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            overflow: hidden;
            background: #020907;
            border: 1px solid rgba(16, 185, 129, 0.2);
            flex-shrink: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 右侧文字排版 */
        .info-box {
            display: flex;
            flex-direction: column;
            gap: 6px; 
            text-align: left;
        }

        .prod-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .prod-price {
            font-size: 15px;
            font-weight: bold;
            color: #3b82f6; 
        }

        .prod-stock {
            font-size: 12px;
            color: #10b981;
        }
    </style>
</head>
