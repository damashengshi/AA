<!DOCTYPE html>

    <style>
        /* 全局AA POKER极深墨绿背景 */
        body { 
            background-color: #020907; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
        }

        /* 顶部返回导航栏 */
        .back-bar {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .back-btn {
            color: #10b981;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 主标题样式 */
        .main-title {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        /* 全局去下划线链接包装 */
        .item-link {
            text-decoration: none;
            display: block;
            margin-bottom: 14px; /* 框与框之间的垂直间距 */
        }
        
        /* 完美复刻：商品条目卡片框 */
        .product-card { 
            background: #04120e; 
            border: 1px solid #064e3b; 
            border-radius: 12px; 
            padding: 16px; 
            box-sizing: border-box; 
            display: flex;
            align-items: center;
            gap: 16px; /* 左侧图片与右侧文字的间距 */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        /* 点击或悬停时的微光反馈 */
        .product-card:hover, .product-card:active {
            border-color: #10b981;
            background: #061c16;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.1);
        }

        /* 左侧统一上传的图片标志容器 */
        .img-logo-box {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            overflow: hidden;
            background: #020907;
            border: 1px solid rgba(16, 185, 129, 0.2);
            flex-shrink: 0; /* 防止图片被挤压变形 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 右侧文字排版区域 */
        .info-box {
            display: flex;
            flex-direction: column;
            gap: 6px; /* 文字行与行之间的纵向微调 */
            text-align: left;
        }

        /* 商品标题：翠绿色带微弱发光 */
        .prod-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        /* 价格：高亮天蓝色 */
        .prod-price {
            font-size: 15px;
            font-weight: bold;
            color: #3b82f6; /* 图中经典明亮的天蓝色 */
        }

        /* 库存：草绿色小字 */
        .prod-stock {
            font-size: 12px;
            color: #10b981;
        }
    </style>
</head>
